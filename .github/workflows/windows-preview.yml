name: Windows portable preview

on:
  push:
    branches: [experiment/cpp-runtime, cursor/windows-ui-preview-063d]
    paths:
      - '.github/workflows/windows-preview.yml'
      - 'cpp-runtime/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: >-
            git
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-sqlite
            mingw-w64-x86_64-nlohmann-json
      - name: Build and stage the preview
        shell: msys2 {0}
        run: |
          cmake -S cpp-runtime -B build-preview -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_MCP_HTTP=OFF -DBUILD_OPCUA_LOOPBACK_FIXTURE=OFF
          cmake --build build-preview --parallel 4
          bash cpp-runtime/deploy/windows/stage.sh build-preview preview-stage
      - name: Make ZIP and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory preview-artifact
          $zip = 'Logistics-Preview-Windows-x64.zip'
          Compress-Archive -Path preview-stage/* -DestinationPath "preview-artifact/$zip"
          $hash = (Get-FileHash "preview-artifact/$zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "preview-artifact/$zip.sha256" "$hash  $zip" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-preview-candidate
          path: preview-artifact/
          if-no-files-found: error
          retention-days: 7

  clean-smoke:
    runs-on: windows-2022
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-preview-candidate
          path: preview-artifact
      - name: Extract and run without a development PATH
        shell: pwsh
        run: |
          $zip = 'Logistics-Preview-Windows-x64.zip'
          $expected = (Get-Content "preview-artifact/$zip.sha256").Split(' ')[0]
          $actual = (Get-FileHash "preview-artifact/$zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'ZIP checksum mismatch' }
          $clean = Join-Path $env:RUNNER_TEMP 'Logistics clean preview'
          Expand-Archive "preview-artifact/$zip" -DestinationPath $clean
          if (-not ((Get-Content "$clean/BUILD-INFO.txt") -contains "source $env:GITHUB_SHA")) {
            throw 'Package source SHA mismatch'
          }
          Get-Content "$clean/BUILD-INFO.txt", "$clean/FILES.txt"
          Write-Output "ZIP SHA-256 $actual"
          python cpp-runtime/deploy/windows/smoke.py "$clean"
          if ($LASTEXITCODE -ne 0) { throw "Preview smoke failed ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-preview-verified
          path: preview-artifact/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: clean-smoke
    if: github.ref == 'refs/heads/cursor/windows-ui-preview-063d' && !contains(github.event.head_commit.message, '[hold-release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-preview-verified
          path: preview-artifact
      - name: Publish the Windows prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import zipfile
          root = pathlib.Path("preview-artifact")
          zip_path = root / "Logistics-Preview-Windows-x64.zip"
          with zipfile.ZipFile(zip_path) as archive:
              info = archive.read("BUILD-INFO.txt").decode("utf-8", "replace")
              exes = [name for name in archive.namelist() if name.lower().endswith(".exe")]
              fonts = [name for name in archive.namelist() if name.startswith("fonts/") and name.lower().endswith(".otf")]
          if exes != ["Logistics.exe"]:
              raise SystemExit(f"expected one Logistics.exe, found {exes}")
          if len(fonts) < 2:
              raise SystemExit(f"expected side-by-side fonts, found {fonts}")
          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          excerpt = "\n".join(info.splitlines()[:8])
          notes = "\n".join([
              "这是模拟工作台的 Windows x64 预发布包，不是现场版本。不连接 S7、LWMS、库卡、华睿或 AGV。",
              "",
              "只发布这一个 ZIP。包内只有 Logistics.exe。Qt、MinGW、SQLite 仍是旁边的 DLL。中文字体在 fonts 目录，不在 exe 里；程序同时接受微软雅黑并允许缺字回退。",
              "",
              "解压后双击 START.cmd。同一个 exe 会分别启动采集器和工作台。",
              "",
              "排序区是四个 PLC：排序区一 170/180，排序区二 190/200，排序区三 210/220，排序区四 230/240。这些工位有名称，没有模拟源，也不会显示工位 140 的数据。",
              "",
              f"ZIP SHA-256：{digest}",
              "",
              "```",
              excerpt,
              "```",
              "",
              f"源码提交：{os.environ['SOURCE_SHA']}",
              "",
          ])
          (root / "RELEASE.md").write_text(notes, encoding="utf-8")
          print(excerpt)
          print("zip", digest, zip_path.stat().st_size)
          PY
          tag=preview-windows-20261124-ui
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Windows preview: one executable and sorting stations" \
            --notes-file preview-artifact/RELEASE.md \
            preview-artifact/Logistics-Preview-Windows-x64.zip
